name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          if [ ! -f gradlew ] && ls *.zip >/dev/null 2>&1; then
            unzip -q -o *.zip -d project_src
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Find project directory
        id: proj
        run: |
          GW=$(find . -maxdepth 4 -name gradlew -not -path "./.git/*" | head -n 1)
          if [ -z "$GW" ]; then
            echo "gradlew NOT FOUND. Files:"
            ls -R | head -n 80
            exit 1
          fi
          DIR=$(dirname "$GW")
          echo "Project dir: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: televizia-apk
          path: ${{ steps.proj.outputs.dir }}/app/build/outputs/apk/debug/*.apk
